      lean: "TranscendentalTuran.main_result"
      module: "TranscendentalTuran.Main"
      status: "proved"
      note: "Exported through Solution; independent Challenge comparison and permitted-axiom check passed under isolation, and Lean and NanoDa accepted. The separately classified con-ron result is an advisory fuel decline."
    - source: "Rational optimization and arithmetic reduction"
      lean: "TranscendentalTuran.Optimization.Paper.six_Ψ_green_transcendental"
      module: "TranscendentalTuran.Optimization.PaperValue"
      status: "proved"
      note: "The exact free-root objective and declaration path were checked in the completed source-fidelity audit."
